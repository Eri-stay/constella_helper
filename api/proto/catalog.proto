syntax = "proto3";

package constella.catalog.v1;

option go_package = "constella/api/catalogpb;catalogpb";

// Catalog streams the content of the active (or a named) cosmos.db build to
// other services. Large result sets are streamed, not paged.
service Catalog {
  // StreamStars sends stars with mag <= mag_max that have a Hipparcos number.
  rpc StreamStars(StarsRequest) returns (stream Star);
  // StreamEdges sends the line segments of one sky culture.
  rpc StreamEdges(EdgesRequest) returns (stream Edge);
}

message StarsRequest {
  double mag_max = 1;   // 0 means no limit
  string build_id = 2;  // empty means the active build
}

message Star {
  int64 id = 1;
  int64 hip = 2;
  string name = 3;
  string con = 4;
  double ra = 5;   // hours
  double dec = 6;  // degrees
  double mag = 7;
}

message EdgesRequest {
  string culture_id = 1;
  string build_id = 2;  // empty means the active build
}

message Edge {
  string constellation_id = 1;
  int64 hip_a = 2;
  int64 hip_b = 3;
}
