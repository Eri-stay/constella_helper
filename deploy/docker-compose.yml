# Constella Dev Platform — local environment.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Admin UI:     http://localhost:8080   (token: PLATFORM_TOKEN, default "dev-token")
# RabbitMQ UI:  http://localhost:15672  (guest / guest)
# Jaeger UI:    http://localhost:16686
#
# HYG data is mounted from HYG_DIR (default ../../data, i.e. constella/data) and
# never committed. Cultures and Ukrainian names come from ../testdata.

name: constella-platform

x-service: &service
  restart: unless-stopped
  environment: &env
    PLATFORM_TOKEN: ${PLATFORM_TOKEN:-dev-token}
    AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:-2.12.0}
    ports:
      - "16686:16686"   # web UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  dataprep:
    <<: *service
    build: { context: .., dockerfile: services/dataprep/Dockerfile }
    environment:
      <<: *env
      HTTP_ADDR: ":8081"
      DB_PATH: /data/dataprep.db
      ARTIFACTS_DIR: /artifacts
      HYG_PATH: /input/hyg/${HYG_FILE:-hyg_v42.csv}   # file name inside HYG_DIR
      INPUT_DIR: /input/testdata
    volumes:
      - dataprep-data:/data
      - artifacts:/artifacts
      - ${HYG_DIR:-../../data}:/input/hyg:ro
      - ../testdata:/input/testdata:ro
    healthcheck: &health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  catalog:
    <<: *service
    build: { context: .., dockerfile: services/catalog/Dockerfile }
    environment:
      <<: *env
      HTTP_ADDR: ":8082"
      GRPC_ADDR: ":9082"
      DB_PATH: /data/catalog.db
      ARTIFACTS_DIR: /artifacts
    volumes:
      - catalog-data:/data
      - artifacts:/artifacts:ro     # database-per-service: only the finished artifact is shared, read-only
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]

  telemetry:
    <<: *service
    build: { context: .., dockerfile: services/telemetry/Dockerfile }
    environment:
      <<: *env
      HTTP_ADDR: ":8084"
      DB_PATH: /data/telemetry.db
      SENTRY_DSN: ${SENTRY_DSN:-}     # empty = Sentry off; the local audit is always written
    volumes:
      - telemetry-data:/data
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/healthz"]

  release:
    <<: *service
    build: { context: .., dockerfile: services/release/Dockerfile }
    environment:
      <<: *env
      HTTP_ADDR: ":8083"
      DB_PATH: /data/release.db
      ARTIFACTS_DIR: /artifacts
      RELEASES_DIR: /releases
      CATALOG_URL: http://catalog:8082
      TELEMETRY_URL: http://telemetry:8084
    volumes:
      - release-data:/data
      - artifacts:/artifacts:ro
      - releases:/releases
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/healthz"]

  research:
    <<: *service
    build: { context: .., dockerfile: services/research/Dockerfile }
    environment:
      <<: *env
      HTTP_ADDR: ":8085"
      DB_PATH: /data/research.db
      CATALOG_URL: http://catalog:8082
      CATALOG_GRPC: catalog:9082
    volumes:
      - research-data:/data
    depends_on:
      rabbitmq: { condition: service_healthy }
      catalog: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/healthz"]

  gateway:
    <<: *service
    build: { context: .., dockerfile: services/gateway/Dockerfile }
    environment:
      <<: *env
      HTTP_ADDR: ":8080"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5500}   # dev: UI from VS Code Live Server
      UPSTREAM_DATAPREP: http://dataprep:8081
      UPSTREAM_CATALOG: http://catalog:8082
      UPSTREAM_RELEASE: http://release:8083
      UPSTREAM_TELEMETRY: http://telemetry:8084
      UPSTREAM_RESEARCH: http://research:8085
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq: { condition: service_healthy }
      dataprep: { condition: service_healthy }
      catalog: { condition: service_healthy }
      release: { condition: service_healthy }
      telemetry: { condition: service_healthy }
      research: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]

volumes:
  rabbitmq-data:
  dataprep-data:
  catalog-data:
  telemetry-data:
  release-data:
  research-data:
  releases:
  artifacts:
